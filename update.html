<!doctype html><html lang="th"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>อัปเดต SMART COMBINE TO RFI</title><style>body{font:18px/1.6 system-ui;max-width:620px;margin:15vh auto;padding:24px;color:#172e41}button{font:inherit;padding:10px 18px}</style><h1>อัปเดต Demo 0.0.6</h1><p id="status">กดปุ่มเพื่อล้างเฉพาะแคชโปรแกรม ข้อมูลโครงการจะไม่ถูกลบ</p><button id="update">อัปเดตเป็น 0.0.6</button><script>document.getElementById('update').onclick=async()=>{const button=document.getElementById('update'),status=document.getElementById('status');button.disabled=true;status.textContent='กำลังอัปเดต…';try{if('serviceWorker'in navigator)await Promise.all((await navigator.serviceWorker.getRegistrations()).map(registration=>registration.unregister()));if('caches'in window)await Promise.all((await caches.keys()).filter(name=>name.startsWith('rfi-demo-')).map(name=>caches.delete(name)));location.replace('./app.html?v=0.0.6');}catch(error){status.textContent='อัปเดตไม่สำเร็จ: '+error.message;button.disabled=false;}}</script></html>
